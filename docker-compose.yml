# Local test of the container with a throwaway Postgres:
#   docker compose up --build
# Reads secrets (GEMINI_API_KEY, SMTP_*, POSTGRES_*) from your .env file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Point the app at the compose database, not your local one.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
